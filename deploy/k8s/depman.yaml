apiVersion: v1
kind: Namespace
metadata:
  name: depman
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: depman-data
  namespace: depman
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: depman
  namespace: depman
  labels:
    app: depman
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # 先起新且 Ready 后再下旧，避免空窗；RWO 靠同节点亲和（见 affinity）
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: depman
  template:
    metadata:
      labels:
        app: depman
    spec:
      # conf / icon：DEPMAN_ETC_DIR=/data/etc（与 DB 同 PVC，重启不丢）
      # 镜像拉取：不在此写 imagePullSecrets；由 ns default ServiceAccount 挂密钥（见 deploy.md）
      # local-path RWO：滚动时优先与旧 Pod 同节点，才能同时挂卷
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: depman
                topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: depman
          image: krccr.ccs.tencentyun.com/igokorea/depman:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DEPMAN_ADDR
              value: ":8080"
            - name: DEPMAN_DATA_DIR
              value: /data
            - name: DEPMAN_DB_PATH
              value: /data/depman.db
            # 与 DB 同 PVC：/data/etc/depman.conf 重启不丢
            - name: DEPMAN_ETC_DIR
              value: /data/etc
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: depman-data
---
apiVersion: v1
kind: Service
metadata:
  name: depman
  namespace: depman
spec:
  selector:
    app: depman
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: depman
  namespace: depman
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: depman.igozhang.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: depman
                port:
                  name: http
